[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-support-bancaire"
version = "1.0.0"
description = "Assistant de support bancaire : intentions (Banking77), recherche documentaire FR/EN, outils simulés, escalade, masquage des données personnelles"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3", "rank-bm25>=0.2.2",
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5", "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
